name: Linux

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - ".editorconfig"
      - ".spi.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux_test:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:${{matrix.swift-version}}
    timeout-minutes: 30
    strategy:
      matrix:
        swift-version:
          - "6.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: swift --version
      - name: Test
        run: swift test
